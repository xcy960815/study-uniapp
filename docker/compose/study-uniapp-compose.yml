name: study-uniapp

services:
  study-uniapp-web:
    image: ${STUDY_UNIAPP_IMAGE:?}
    container_name: ${CONTAINER_NAME:?}
    user: 'root'
    ports:
      - "${PORT_WEB:?}:80"
    restart: always
    environment:
      TZ: ${TZ:?}
    volumes:
      - ${LOG_DIR_PATH:?}:/var/log/nginx
    networks:
      - study-uniapp-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  study-uniapp-network:
    name: ${NETWORK_NAME:?}
    driver: bridge
